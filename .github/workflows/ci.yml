# @orcastrate
# template: node/ci
# params:
#   bun_version: "1.4.3"
#   lint_command: bun run lint
#   test_command: bun run test
#   typecheck_command: bun run typecheck
#   build_command: bun run build
# @end-orcastrate

name: Test & Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
 

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and lint with Biome
        uses: mongolyy/reviewdog-action-biome@c49bee54c1f87e4be32446ae3deca3a186b88a3a # v2.11.2
        with:
          reporter: github-check
          fail_on_error: true
          biome_flags: .


      - name: Additional lint
        run: bun run lint


      - name: Type check
        run: bun run typecheck


      - name: Test
        run: bun run test



      - name: Build
        run: bun run build
